services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nota-tecnica-backend
    restart: unless-stopped
    ports:
      - "4296:4296"
    env_file:
      - .env
    environment:
      SCSE_DB_USER: ${SCSE_DB_USER:-BDLIGA}
      SCSE_DB_PASSWD: ${SCSE_DB_PASSWD:-scse}
      SCSE_DB_IP: ${SCSE_DB_IP:-160.1.1.99}
      SCSE_DB_PORT: ${SCSE_DB_PORT:-1521}
      SCSE_DB_DATABASE: ${SCSE_DB_DATABASE:-scse}
      JWT_SECRET: ${JWT_SECRET:-liga_cancer_nota_tecnica_2026_secret}
    networks:
      - nota-tecnica-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: nota-tecnica-frontend
    restart: unless-stopped
    ports:
      - "3924:3924"
    depends_on:
      - backend
    networks:
      - nota-tecnica-net

networks:
  nota-tecnica-net:
    driver: bridge